name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build checks use inert values and never connect to production services.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_TOOLS_API_BASE_URL: http://127.0.0.1:9
      TOOLS_API_BASE_URL: http://127.0.0.1:9
      R2_ACCESS_KEY_ID: ci-placeholder
      R2_SECRET_ACCESS_KEY: ci-placeholder
      R2_ENDPOINT: http://127.0.0.1:9
      R2_BUCKET_NAME: ci-placeholder
      R2_PUBLIC_DOMAIN: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        id: install
      - run: npm run lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - run: npm run build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
